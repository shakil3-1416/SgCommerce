services:

  mongodb:
    image: mongo:7.0.43-jammy
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --eval \"quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s


  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "4000"

      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}

      MONGODB_URI: mongodb://mongodb:27017/sgcommerce
      MONGO_URI: mongodb://mongodb:27017/sgcommerce
      MONGODB_URL: mongodb://mongodb:27017/sgcommerce

      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3100,http://localhost:3101}

      SG_ADMIN_EMAIL: ${SG_ADMIN_EMAIL:?SG_ADMIN_EMAIL is required}
      SG_ADMIN_PHONE: ${SG_ADMIN_PHONE:?SG_ADMIN_PHONE is required}
      SG_ADMIN_PASSWORD: ${SG_ADMIN_PASSWORD:?SG_ADMIN_PASSWORD is required}

    depends_on:
      mongodb:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "4000:4000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s


  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: http://api:4000/api/v1
      CUSTOMER_COOKIE_SECURE: ${CUSTOMER_COOKIE_SECURE:-true}

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3100:3100"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s


  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3101"
      HOSTNAME: 0.0.0.0

      API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "3101:3101"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3101/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s


volumes:
  mongodb_data:
  redis_data:
