name: SgCommerce CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sgcommerce-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter api typecheck

      - name: Storefront typecheck
        run: pnpm --filter storefront typecheck

      - name: Admin typecheck
        run: pnpm --filter admin typecheck

      - name: API build
        run: pnpm --filter api build

      - name: Storefront build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          INTERNAL_API_URL: http://127.0.0.1:4000/api/v1
        run: pnpm --filter storefront build

      - name: Admin build
        env:
          API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
          ADMIN_COOKIE_SECURE: "false"
        run: pnpm --filter admin build

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
