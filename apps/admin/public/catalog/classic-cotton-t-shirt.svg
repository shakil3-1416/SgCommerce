<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 1200"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Classic Cotton T-Shirt
  </title>

  <desc id="description">
    Dark classic cotton T-shirt product illustration on a light background.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#f7f4fa"
      />

      <stop
        offset="100%"
        stop-color="#ece5f3"
      />
    </linearGradient>

    <linearGradient
      id="shirt"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
