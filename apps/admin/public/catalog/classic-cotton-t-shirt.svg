        offset="0%"
        stop-color="#291743"
      />

      <stop
        offset="55%"
        stop-color="#1f1235"
      />

      <stop
        offset="100%"
        stop-color="#38205f"
      />
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="28"
        stdDeviation="32"
        flood-color="#1f1235"
        flood-opacity="0.18"
      />
